; Threshold: stereoscopic 3D, DLSS Multi Frame Generation and DLSS model updates for Control.
; Re-read every 250 ms; Quiver's Options page writes this file.

[game]
; Skip the startup videos (sets m_bSkipIntroVideos in the game's renderer.ini at launch).
skip_intro = 1

[dlss]
; The game's model switch (m_bDLSSLegacyModel in renderer.ini). The game's default is 1 (the CNN
; presets E/F); 0 makes the game ask for preset K (DLSS 4 transformer). For the DLSS 4.5 presets M/L,
; Threshold ships nvngx_dlss.dll 310.9.16; pick the preset with Quiver's "DLSS Super Resolution model"
; tweak (dlss.sr.model), which overrides the game's request (docs/dlss.md).
legacy_model = 0
; Ray Reconstruction (m_eDLSSQuality = 2). The game's RR path passes no normals/albedo and crashes
; under Proton, where the driver's RR DLL is found; 0 refuses the RR feature so the game uses Super
; Resolution, as it does on Windows. 1 is for experiments only.
ray_reconstruction = 0

[fg]
; DLSS Frame Generation / Multi Frame Generation (needs the game's DLSS on, any quality or DLAA;
; RTX 40 for 2x, RTX 50 for 3x-6x). Read at start.
enabled = 0
; Frames presented per rendered frame: 2 (2x) .. 6 (6x), or auto (between count_min and count_max,
; aiming at target_hz presents/s with the rendered rate capped at target_hz / multiplier). Live.
count = 2
count_min = 2
count_max = 4
; Presents/s count = auto aims for: 0 = the display's refresh rate. Live.
target_hz = 0
; Cap on rendered frames/s (0 = none: auto_cap / count = auto decide). Live.
fps_limit = 0
; Automatic cap with headroom: keeps the game's frame rate where DLSS-G finishes within auto_cap_lag
; of a frame after the game's Present and the game never waits for the presents (even cadence), and
; at most target_hz / multiplier. Off (default): uncapped unless fps_limit or count = auto. Live.
auto_cap = 0
auto_cap_lag = 0.7
; NVIDIA Reflex injected (the game has none): off | on | boost. Through dxvk-nvapi and vkd3d-proton
; (Proton: PROTON_ENABLE_NVAPI=1). The frame cap stays auto_cap / fps_limit. Live.
reflex = off
reflex_markers = 1
; Live on/off without a restart (the proxies stay; off presents rendered frames only).
active = 1
; all | generated | real | hudless: which frames to present (debugging; screenshots of one kind;
; hudless shows the HUD-less copy in place of real frames).
show = all
; Camera for DLSS-G: engine (the game's main view matrices) | identity (the v1 stand-in). Live.
camera = engine
; Give DLSS-G the frame before the HUD was drawn, so the HUD isn't interpolated. Live.
hudless = 1
; Present pacing: smooth (even spacing from each Present's call) | ready (v1: as soon as DLSS-G is
; done, then from each Present's return). Live.
pace = smooth
; smooth: share of how early DLSS-G finished that the first generated frame may come early (0..1). Live.
pace_relax = 0.5
; Real swapchain buffers while frame generation is enabled (the game asks for 2).
buffers = 3

[stereo]
; Stereoscopic 3D (docs/stereo.md): both eyes rendered from the same game update.
;   off        pass-through
;   left/right every frame from one eye (for measurement)
;   sbs        both eyes inside one engine frame, composed side by side (about half the frame rate)
;   auto       sbs while the game's monitor is a HypXRland stereo (side-by-side) output, off elsewhere
;              (like the Quiver app's "3D on stereo displays: Auto"; default)
; With [fg] enabled = 1 frame generation runs per eye (one DLSS-G feature each; convergence then goes
; into the projection). docs/stereo.md "Stereo with frame generation".
mode = auto
; per-eye lateral offset in millimetres (65 mm interocular = 32.5 per eye)
separation = 32.5
; distance of the screen plane in metres: nearer things come out of the screen, farther ones sit
; behind it. 0 = parallel eyes (distant things at the screen, everything else in front of it,
; HUD included). 3-5 m suits the third-person camera.
convergence = 4
swap_eyes = 0
; side-by-side output (read at start-up: it sizes the swapchain):
;   full = swapchain twice the game's width, each eye 1:1 (3840x1080 for 1920x1080 per eye), for
;          glasses driven as a plain 3840x1080 desktop: the game's window is made twice its width
;          (borderless or windowed; exclusive fullscreen is not supported with it), and the desktop
;          reads as one eye wide to the game (borderless then renders one 1920x1080 eye)
;   sbs  = the same buffer under HypXRland: the window keeps the desktop size; needs a Proton whose
;          Wayland driver accepts a swapchain larger than the window (GE-Proton11-12-hypxr with
;          PROTON_ENABLE_WAYLAND=1 and WINE_VULKAN_ALLOW_LARGER_SWAPCHAIN=1)
;   hsbs = normal swapchain; both eyes at the game's resolution, squeezed 2:1 into the two halves
;          (HypXRland's 3D mode with any Proton: it stretches each half back)
;   auto = (default) on a HypXRland stereo display: sbs with the larger-swapchain Proton, else hsbs;
;          elsewhere none, or full when mode is forced to sbs
;   none = normal swapchain; 3D modes then render a normal (mono) image
output = auto
; with a side-by-side output: tag the game's window `stereo-sbs` (full, sbs) or `stereo-hsbs` over the
; Hyprland IPC socket so a HypXRland rule (`stereo <layout> always, match tag stereo-<layout>`)
; presents it per eye. Inert without Hyprland.
hyprland_tag = 1
; Per-eye temporal state (TAA, previous camera, object motion, RT denoisers, reflections, volumetric
; light, render-graph history): 1 = each eye its own (default); 0 = shared (comparison only)
per_eye = 1
; sbs with the game's DLSS on: 1 = a DLSS feature (history) per eye; 0 = one shared feature
dlss_per_eye = 1
; HUD markers anchored in the world (objectives, interaction and collectible prompts): 1 = drawn at the
; depth of what they mark, or just in front of the first surface hiding it; 0 = at the screen plane
; with the rest of the HUD
ui_markers = 1
; pause menu: 1 = its frozen background per eye (3D under the menu); 0 = the left eye's image in
; both eyes
ui_pause = 1
